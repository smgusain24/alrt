[project]
name = "alrt-workers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "httpx>=0.28",
    "cryptography>=44",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "jinja2>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["alrt_workers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
