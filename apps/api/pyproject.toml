[project]
name = "alrt-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "redis>=5.2",
    "slowapi>=0.1.9",
    "asyncpg>=0.30",
    "bcrypt>=4.0",
    "httpx>=0.27",
    "cryptography>=44",
    "jinja2>=3.1",
    "celery[redis]>=5.4",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["alrt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
