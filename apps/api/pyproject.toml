[project]
name = "alrt-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "redis>=5.2",
    "alrt-db",
]

[tool.uv.sources]
alrt-db = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["alrt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
