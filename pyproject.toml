[project]
name = "alrt"
version = "1.0.0"
description = "Open-source, self-hostable notification infrastructure"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "h2>=4.3.0",
    "pyjwt>=2.12.1",
]

[project.urls]
Homepage = "https://github.com/smgusain24/alrt"
Repository = "https://github.com/smgusain24/alrt"
Issues = "https://github.com/smgusain24/alrt/issues"
Changelog = "https://github.com/smgusain24/alrt/blob/main/CHANGELOG.md"

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/workers",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps/api", "apps/workers"]

[tool.ruff]
target-version = "py312"
line-length = 120

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
