[project]
name = "alrt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "razorpay>=2.0.1",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/workers",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps/api", "apps/workers"]

[tool.ruff]
target-version = "py312"
line-length = 120

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
