[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alrt-python"
version = "0.1.0"
description = "Official Python SDK for alrt notification infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alrt_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"

[tool.mypy]
strict = true
