[project]
name = "alrt-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["alrt_db"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
